function ksUnlock(pw){return KS.decrypt(KSPAGE,pw).then(function(html){try{sessionStorage.setItem('ks_pw',pw);}catch(e){}document.open();document.write(html);document.close();}).catch(function(){var el=document.getElementById('kserr');if(el)el.textContent='Неверный пароль';});}
(function(){var pw=null;try{pw=sessionStorage.getItem('ks_pw');}catch(e){}if(pw)ksUnlock(pw);})();
window.addEventListener('DOMContentLoaded',function(){var g=document.getElementById('ksgo'),i=document.getElementById('kspw');if(g)g.onclick=function(){ksUnlock(i.value);};if(i){i.addEventListener('keydown',function(e){if(e.key==='Enter')ksUnlock(i.value);});i.focus();}});
